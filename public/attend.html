<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mark Attendance</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f5fb; color: #1a1e33; margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 28px; max-width: 380px; width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  h2 { margin-top: 0; font-size: 1.2rem; }
  select, button, a.btn {
    width: 100%; padding: 14px; border-radius: 10px; font-size: 1rem; margin-top: 10px;
    box-sizing: border-box; display: block; text-align: center; text-decoration: none;
  }
  select { border: 1px solid #d5d8e5; }
  button, a.btn { background: #6366f1; color: #fff; border: none; font-weight: 600; cursor: pointer; }
  button:disabled { background: #c7c9e6; cursor: not-allowed; }
  #status { margin-top: 16px; font-size: 0.9rem; line-height: 1.4; }
  .ok { color: #16a34a; font-weight: 600; }
  .err { color: #dc2626; font-weight: 600; }
  .gate-box {
    background: #eff6ff; border: 1px solid #93c5fd; border-radius: 10px; padding: 16px;
    font-size: 0.9rem; line-height: 1.5; color: #1e3a8a;
  }
  .gate-box b { display: block; margin-bottom: 6px; }
  .hint { font-size: 0.75rem; color: #6b7280; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h2>Mark Yourself Present</h2>

    <div id="gate">
      <div class="gate-box">
        <b>One more tap needed</b>
        For attendance to work correctly, this needs to open in your regular browser (not a quick preview). Tap below to continue.
      </div>
      <a class="btn" id="continueBtn" href="#">Continue in Safari</a>
      <div class="hint" id="gateHint"></div>
    </div>

    <div id="form" style="display:none;">
      <label for="roll">Select your name / roll number</label>
      <select id="roll"><option>Loading roster…</option></select>
      <button id="submitBtn" onclick="submitAttendance()">Mark Present</button>
    </div>
    <div id="status"></div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const teacherId = params.get('t');
const classId = params.get('c');
const sessionId = params.get('session');
const token = params.get('token');
const alreadyGated = params.get('safari') === '1';
const statusEl = document.getElementById('status');

function getDeviceId() {
  let id = localStorage.getItem('attendanceDeviceId');
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    localStorage.setItem('attendanceDeviceId', id);
  }
  return id;
}

function buildGateLinks() {
  const url = new URL(window.location.href);
  url.searchParams.set('safari', '1');
  const target = url.toString();
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent || '');
  const isAndroid = /Android/.test(navigator.userAgent || '');
  const btn = document.getElementById('continueBtn');
  const hint = document.getElementById('gateHint');

  if (isIOS) {
    btn.href = target.replace(/^https?:\/\//, (m) => 'x-safari-' + m);
    hint.textContent = 'This opens Safari.';
  } else if (isAndroid) {
    btn.href = 'intent://' + target.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end;';
    hint.textContent = "This opens Chrome. If nothing happens, copy this page's link and paste it into Chrome manually.";
  } else {
    btn.href = target;
    hint.textContent = '';
  }
}

if (!teacherId || !classId || !sessionId || !token) {
  document.getElementById('gate').style.display = 'none';
  statusEl.innerHTML = '<span class="err">Invalid link. Please scan the QR code shown on the classroom screen.</span>';
} else if (!alreadyGated) {
  buildGateLinks();
} else {
  startCheckInFlow();
}

function startCheckInFlow() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('form').style.display = 'block';
  const deviceId = getDeviceId();
  loadRoster();

  async function loadRoster() {
    try {
      const res = await fetch(`/api/roster-lite?t=${encodeURIComponent(teacherId)}&c=${encodeURIComponent(classId)}`);
      const roster = await res.json();
      const sel = document.getElementById('roll');
      sel.innerHTML = roster
        .map(r => `<option value="${r.rollNumber}">${r.name} (${r.rollNumber})</option>`)
        .join('');
    } catch (e) {
      statusEl.innerHTML = '<span class="err">Could not load class roster.</span>';
    }
  }

  window.submitAttendance = async function submitAttendance() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    statusEl.textContent = 'Submitting…';
    const rollNumber = document.getElementById('roll').value;
    try {
      const res = await fetch('/api/attend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teacherId, classId, sessionId, token, rollNumber, deviceId }),
      });
      const data = await res.json();
      if (data.ok) {
        statusEl.innerHTML = `<span class="ok">✓ Marked present — ${data.name}</span>`;
        document.getElementById('form').style.display = 'none';
      } else {
        statusEl.innerHTML = `<span class="err">${data.reason}</span>`;
        btn.disabled = false;
      }
    } catch (e) {
      statusEl.innerHTML = '<span class="err">Network error. Please try again.</span>';
      btn.disabled = false;
    }
  };
}
</script>
</body>
</html>
